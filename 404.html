<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Finance App</title>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <div class="center-screen">
    <div class="card" style="text-align:center;max-width:460px;width:100%">
      <div style="font-size:48px;font-weight:700;color:var(--primary)">404</div>
      <h2>Page not found</h2>
      <p class="muted">We couldn't find <span id="path" style="font-family:var(--mono);overflow-wrap:anywhere"></span>.
        It may have been moved, or the link may be wrong.</p>
      <p style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap">
        <a class="btn btn-primary" href="/" style="text-decoration:none">Go to Home</a>
        <button class="btn" type="button" id="back">Go back</button>
      </p>
    </div>
  </div>
  <script>
    document.getElementById('path').textContent = location.pathname;
    document.getElementById('back').addEventListener('click', function () {
      if (history.length > 1) history.back(); else location.href = '/';
    });
  </script>
</body>
</html>
