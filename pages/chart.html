<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chart of Accounts | Finance App</title>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <main class="container">
    <div class="page-head">
      <div><h2>Chart of Accounts</h2><span class="muted" id="company-title"></span></div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="groups" type="button">Groups</button>
      <button class="tab" data-tab="accounts" type="button">Accounts</button>
    </div>
    <div class="toolbar" id="toolbar"></div>
    <p class="muted" id="hint"></p>
    <div class="card" id="panel"></div>
  </main>
  <script type="module" src="/js/modules/chart.js"></script>
</body>
</html>
